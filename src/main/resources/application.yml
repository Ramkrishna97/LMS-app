spring:
  servlet:
    multipart:
      max-file-size: 250MB
      max-request-size: 260MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/lms;AUTO_SERVER=TRUE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 260MB

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

